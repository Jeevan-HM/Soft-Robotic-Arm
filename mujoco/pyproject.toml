[project]
name = "simulation"
version = "0.1.0"
description = "Robot-data-calibrated MuJoCo digital twin of a pneumatic soft arm"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mujoco>=3.5.0",
    "numpy>=2.0.2",
    "scipy>=1.13.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mjcf_model", "simulator", "calibration"]

[tool.pytest.ini_options]
pythonpath = ["."]
