[project]
name = "soft-robotic-arm"
version = "0.2.0"
description = "Calibrated MuJoCo digital twin and coursework API for a pneumatic soft arm"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["soft robotics", "mujoco", "pneumatic", "simulation", "control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mujoco>=3.5.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
coursework = [
    "imageio[ffmpeg]>=2.31",
    "ipython>=8",
    "matplotlib>=3.7",
]
test = [
    "build>=1.2",
    "pytest>=8",
]

[project.urls]
Repository = "https://github.com/Jeevan-HM/Soft-Robotic-Arm"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["calibration", "simulator", "mjcf_model"]

[tool.setuptools.packages.find]
where = ["."]
include = ["soft_robotic_arm*"]

[tool.setuptools.package-data]
soft_robotic_arm = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
