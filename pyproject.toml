[project]
name = "simulation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "imageio[ffmpeg]>=2.37.2",
    "matplotlib>=3.9.4",
    "mujoco>=3.5.0",
    "numpy>=2.0.2",
    "pandas>=2.2.3",
    "pyzmq>=26.0.0",
    "scipy>=1.13.1",
]

[project.scripts]
simulation = "simulation:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
